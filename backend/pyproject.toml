[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnwatch"
version = "0.1.0"
description = "VulnWatch - self-hosted vulnerability intelligence dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = ["app", "app.routes", "app.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
